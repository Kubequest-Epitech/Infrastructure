---
- name: Preparation de tous les noeuds
  hosts: kube_all
  tags: preparation
  become: true
  roles:
    - docker
    - install_kubeadm

- name: Configurer le cluster Kubernetes
  hosts: kube_all
  tags: configure
  become: true
  roles:
    - configure_kubeadm

- name: Creer les namespaces applicatifs
  hosts: kube1
  tags: namespaces
  become: true
  roles:
    - namespaces

- name: Creer les Secrets Kubernetes (donnees sensibles)
  hosts: kube1
  tags:
    - secrets
  become: true
  roles:
    - secrets

# Helm est requis par traefik, cert-manager et argocd : installe une seule fois,
# avant tout le reste. Tag multiple pour que make traefik/argocd/cert-manager
# tirent l'installation de Helm au besoin.
- name: Installer Helm
  hosts: kube1
  tags:
    - helm
    - traefik
    - argocd
    - cert-manager
  become: true
  roles:
    - install_helm


- name: Deployer Traefik
  hosts: kube1
  tags: traefik
  become: true
  roles:
    - traefik

- name: Deployer cert-manager
  hosts: kube1
  tags: cert-manager
  become: true
  roles:
    - cert-manager

- name: Installer ArgoCD sur le control-plane
  hosts: kube1
  tags: argocd
  become: true
  roles:
    - argocd

- name: Deployer PostgreSQL sur le cluster
  hosts: kube1
  tags: postgres
  become: true
  roles:
    - postgres

- name: Deployer Loki sur le cluster
  hosts: kube1
  tags:
    - loki
    - helm
  become: true
  roles:
    - loki

- name: Deployer Promtail sur le cluster
  hosts: kube1
  tags:
    - promtail
    - helm
  become: true
  roles:
    - promtail

- name: Supprimer le cluster Kubernetes
  hosts: kube_all
  tags:
    - reset
    - never
  become: true
  roles:
    - reset_kubeadm
