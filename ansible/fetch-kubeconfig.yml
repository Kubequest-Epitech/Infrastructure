---
- name: Recuperer le kubeconfig du control-plane et l'ecrire en local
  hosts: kube1
  become: true
  gather_facts: false
  tasks:
    - name: Lire /etc/kubernetes/admin.conf sur le control-plane
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: S'assurer que ~/.kube existe en local
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Ecrire le kubeconfig patche en local
      ansible.builtin.copy:
        content: >-
          {{
            admin_conf['content']
            | b64decode
            | regex_replace('server: https://[0-9.]+:6443',
                            'server: https://' + inventory_hostname + ':6443')
          }}
        dest: "{{ lookup('env', 'HOME') }}/.kube/config-kubequest"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Afficher les instructions d'utilisation
      ansible.builtin.debug:
        msg:
          - "Kubeconfig ecrit dans ~/.kube/config-kubequest"
          - "Utiliser : export KUBECONFIG=~/.kube/config-kubequest"
          - "Puis    : kubectl get nodes"
