---
- name: Creer le repertoire .kube
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['kube1']

- name: Rafraichir le kubeconfig depuis admin.conf
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
    mode: "0600"
  when: inventory_hostname in groups['kube1']

- name: Verifier la connexion au cluster
  ansible.builtin.command:
    cmd: kubectl get pods -A
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups['kube1']

- name: Supprimer les workers du cluster
  ansible.builtin.shell:
    cmd: |
      NODES=$(kubectl get nodes \
        --selector='!node-role.kubernetes.io/control-plane' \
        -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
      [ -n "$NODES" ] && echo "$NODES" | xargs kubectl delete node --force --grace-period=0 || true
  when: inventory_hostname in groups['kube1']
  failed_when: false
  changed_when: true

- name: Reset kubeadm sur les workers
  ansible.builtin.command:
    cmd: kubeadm reset -f
  when: inventory_hostname not in groups['kube1']
  changed_when: true

- name: Reset kubeadm sur le control plane
  ansible.builtin.command:
    cmd: kubeadm reset -f
  when: inventory_hostname in groups['kube1']
  changed_when: true

- name: Supprimer le repertoire .kube
  ansible.builtin.file:
    path: /root/.kube
    state: absent

- name: Supprimer le repertoire /etc/kubernetes
  ansible.builtin.file:
    path: /etc/kubernetes
    state: absent
