---
- name: Deployer Kubernetes Dashboard
  ansible.builtin.command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/v2.7.0/aio/deploy/recommended.yaml
  register: dashboard_deploy
  changed_when: "'created' in dashboard_deploy.stdout"

- name: Patcher les deployments pour le node monitoring
  ansible.builtin.command:
    cmd: >
      kubectl patch deployment {{ item }} -n kubernetes-dashboard
      --type=json -p='[
        {"op": "add", "path": "/spec/template/spec/nodeSelector", "value": {"node-role.kubernetes.io/monitoring": ""}},
        {"op": "add", "path": "/spec/template/spec/tolerations", "value": [{"key": "dedicated", "operator": "Equal", "value": "monitoring", "effect": "NoSchedule"}]}
      ]'
  loop:
    - kubernetes-dashboard
    - dashboard-metrics-scraper
  changed_when: true

- name: Copier le manifest admin-user
  ansible.builtin.copy:
    src: admin-user.yml
    dest: /tmp/dashboard-admin-user.yml
    mode: "0644"

- name: Creer le ServiceAccount admin-user
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/dashboard-admin-user.yml
  register: sa_create
  changed_when: "'created' in sa_create.stdout"

- name: Copier le manifest IngressRoute
  ansible.builtin.copy:
    src: ingressroute.yml
    dest: /tmp/dashboard-ingressroute.yml
    mode: "0644"

- name: Appliquer l'IngressRoute
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/dashboard-ingressroute.yml
  register: ir_create
  changed_when: "'created' in ir_create.stdout"

- name: Generer le token d'acces
  ansible.builtin.command:
    cmd: kubectl -n kubernetes-dashboard create token admin-user
  register: dashboard_token
  changed_when: false

- name: Afficher le token d'acces au dashboard
  ansible.builtin.debug:
    msg: "Token d'acces au dashboard : {{ dashboard_token.stdout }}"
