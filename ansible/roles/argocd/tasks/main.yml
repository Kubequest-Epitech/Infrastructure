---
- name: Add ArgoCD Helm repo
  ansible.builtin.command:
    cmd: helm repo add argo https://argoproj.github.io/argo-helm
  register: argocd_repo_add
  changed_when: "'has been added' in argocd_repo_add.stdout"
  failed_when: argocd_repo_add.rc != 0 and 'already exists' not in argocd_repo_add.stderr

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Copy ArgoCD values to control plane
  ansible.builtin.copy:
    src: values.yml
    dest: /tmp/argocd-values.yml
    mode: "0644"

- name: Verifier si le secret argocd-redis existe
  ansible.builtin.command:
    cmd: kubectl get secret argocd-redis -n {{ argocd_namespace }}
  register: redis_secret_check
  failed_when: false
  changed_when: false

- name: Creer le secret argocd-redis
  ansible.builtin.shell:
    cmd: >
      kubectl create secret generic argocd-redis
      --from-literal=auth="$(openssl rand -base64 32)"
      -n {{ argocd_namespace }}
  when: redis_secret_check.rc != 0
  changed_when: true

- name: Deploy ArgoCD via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argocd argo/argo-cd
      --namespace {{ argocd_namespace }}
      --version {{ argocd_chart_version }}
      --values /tmp/argocd-values.yml
  register: argocd_helm_install
  changed_when: "'STATUS: deployed' in argocd_helm_install.stdout"

- name: Wait for ArgoCD to be ready
  ansible.builtin.command:
    cmd: >
      kubectl wait --for=condition=available
      deployment/argocd-server
      -n {{ argocd_namespace }}
      --timeout=180s
  changed_when: false

- name: Creer le projet ArgoCD default
  ansible.builtin.shell:
    cmd: |
      kubectl apply -f - <<'EOF'
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: default
        namespace: {{ argocd_namespace }}
      spec:
        sourceRepos:
          - '*'
        destinations:
          - namespace: '*'
            server: '*'
        clusterResourceWhitelist:
          - group: '*'
            kind: '*'
      EOF
  register: argocd_project_apply
  changed_when: "'created' in argocd_project_apply.stdout or 'configured' in argocd_project_apply.stdout"

- name: Copy nex-application Application manifest to control plane
  ansible.builtin.template:
    src: nex-application.yml
    dest: /tmp/nex-application.yml
    mode: "0644"
  tags: [app]

- name: Create nex-application Application in ArgoCD
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/nex-application.yml
  register: argocd_nex_apply
  changed_when: "'created' in argocd_nex_apply.stdout or 'configured' in argocd_nex_apply.stdout"
  tags: [app]

- name: Force ArgoCD to refresh nex-application (re-pull du repo)
  ansible.builtin.command:
    cmd: >
      kubectl -n {{ argocd_namespace }} annotate application nex-application
      argocd.argoproj.io/refresh=hard --overwrite
  changed_when: true
  tags: [app]

- name: Add kubquest-argo alias to retrieve admin password
  ansible.builtin.lineinfile:
    path: /home/ec2-user/.bashrc
    line: >-
      alias kubquest-argo="kubectl -n argocd get secret
      argocd-initial-admin-secret
      -o jsonpath=\"{.data.password}\" | base64 -d && echo"
    regexp: "^alias kubquest-argo="
    state: present

- name: Display cluster information
  ansible.builtin.include_tasks: info.yml
