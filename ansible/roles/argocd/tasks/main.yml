---
- name: Add ArgoCD Helm repo
  ansible.builtin.command:
    cmd: helm repo add argo https://argoproj.github.io/argo-helm
  register: argocd_repo_add
  changed_when: "'has been added' in argocd_repo_add.stdout"
  failed_when: argocd_repo_add.rc != 0 and 'already exists' not in argocd_repo_add.stderr

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Create namespace {{ argocd_namespace }}
  ansible.builtin.command:
    cmd: kubectl create namespace {{ argocd_namespace }}
  register: argocd_ns_create
  changed_when: "'created' in argocd_ns_create.stdout"
  failed_when: argocd_ns_create.rc != 0 and 'already exists' not in argocd_ns_create.stderr

- name: Copy ArgoCD values to control plane
  ansible.builtin.copy:
    src: values.yml
    dest: /tmp/argocd-values.yml
    mode: "0644"

- name: Deploy ArgoCD via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argocd argo/argo-cd
      --namespace {{ argocd_namespace }}
      --version {{ argocd_chart_version }}
      --values /tmp/argocd-values.yml
  register: argocd_helm_install
  changed_when: "'STATUS: deployed' in argocd_helm_install.stdout"

- name: Wait for ArgoCD to be ready
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=available deployment/argocd-server -n {{ argocd_namespace }} --timeout=180s
  changed_when: false

- name: Add kubquest-argo alias to retrieve admin password
  ansible.builtin.lineinfile:
    path: /home/ec2-user/.bashrc
    line: 'alias kubquest-argo="kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath=\"{.data.password}\" | base64 -d && echo"'
    regexp: '^alias kubquest-argo='
    state: present

- name: Display cluster information
  ansible.builtin.include_tasks: info.yml
