---
- name: Retrieve ArgoCD admin password
  ansible.builtin.command:
    cmd: >
      kubectl -n {{ argocd_namespace }} get secret
      argocd-initial-admin-secret
      -o jsonpath="{.data.password}"
  register: argocd_secret
  changed_when: false

- name: Decode ArgoCD password
  ansible.builtin.set_fact:
    argocd_password: "{{ argocd_secret.stdout | b64decode }}"

- name: Resolve worker node IP (any worker has Traefik via DaemonSet)
  ansible.builtin.command:
    cmd: dig +short {{ hostvars[groups['workers'][0]]['inventory_hostname'] }}
  register: worker_ip_result
  changed_when: false
  delegate_to: localhost
  become: false

- name: Set worker IP
  ansible.builtin.set_fact:
    ingress_ip: "{{ worker_ip_result.stdout | trim }}"

- name: Retrieve cluster nodes
  ansible.builtin.command:
    cmd: >-
      kubectl get nodes -o
      custom-columns=NAME:.metadata.name,STATUS:.status.conditions[-1].type,ROLE:.metadata.labels.node-role\.kubernetes\.io,IP:.status.addresses[0].address
      --no-headers
  register: argocd_cluster_nodes
  changed_when: false

- name: Display cluster information
  ansible.builtin.pause:
    seconds: 1
    prompt: |

      ======================================================
                    CLUSTER KUBEQUEST - INFO
      ======================================================

      NODES:
      {{ argocd_cluster_nodes.stdout }}

      ARGOCD:
        Dashboard : https://{{ argocd_ingress_host }}
        User      : admin
        Password  : {{ argocd_password }}
        Alias SSH : kubquest-argo (on K1)
        Command   : make argocd-password (from your machine)

      LOCAL DNS (run on your machine if IP changed):
        make dns
        -- or manually --
        Mac     : sudo sed -i '' '/kubequest.local/d' /etc/hosts && echo "{{ ingress_ip }} {{ argocd_ingress_host }}" | sudo tee -a /etc/hosts
        Linux   : sudo sed -i '/kubequest.local/d' /etc/hosts && echo "{{ ingress_ip }} {{ argocd_ingress_host }}" | sudo tee -a /etc/hosts
        Windows : powershell -Command "(Get-Content C:\Windows\System32\drivers\etc\hosts | Where-Object { $_ -notmatch 'kubequest.local' }) + '{{ ingress_ip }} {{ argocd_ingress_host }}' | Set-Content C:\Windows\System32\drivers\etc\hosts" (run as Admin)

      ======================================================
