nodeSelector:
  node-role.kubernetes.io/ingress: ""

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "ingress"
    effect: "NoSchedule"

service:
  type: ClusterIP

ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443

ingressRoute:
  dashboard:
    enabled: true

additionalArguments:
  - "--api.insecure=true"
  - "--api.dashboard=true"
