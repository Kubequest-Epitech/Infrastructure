---
- name: Ajouter le repo Helm Traefik
  ansible.builtin.command:
    cmd: helm repo add traefik https://traefik.github.io/charts
  register: traefik_repo_add
  changed_when: "'has been added' in traefik_repo_add.stdout"
  failed_when: traefik_repo_add.rc != 0 and 'already exists' not in traefik_repo_add.stderr

- name: Mettre a jour les repos Helm
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Copier les values Traefik sur le control plane
  ansible.builtin.copy:
    src: values.yml
    dest: /tmp/traefik-values.yml
    mode: "0644"

- name: Deployer Traefik via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install traefik traefik/traefik
      --namespace {{ traefik_namespace }}
      --version {{ traefik_chart_version }}
      --values /tmp/traefik-values.yml
  register: traefik_helm_install
  changed_when: "'STATUS: deployed' in traefik_helm_install.stdout"
