---
- name: Verifier si le cluster est deja initialise
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: configure_kubeadm_already_init

- name: Initialiser le cluster avec kubeadm
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --pod-network-cidr=192.168.0.0/16
      --apiserver-cert-extra-sans={{ inventory_hostname }},127.0.0.1
  when: not configure_kubeadm_already_init.stat.exists
  changed_when: true

- name: Creer le repertoire .kube
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0755"

- name: Copier admin.conf dans .kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Reduire le delai d'eviction des pods (30s au lieu de 300s)
  ansible.builtin.lineinfile:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    insertafter: "- kube-apiserver"
    line: "    - --default-not-ready-toleration-seconds=30"
    regexp: "--default-not-ready-toleration-seconds="
  when: not configure_kubeadm_already_init.stat.exists

- name: Reduire le delai d'eviction unreachable (30s au lieu de 300s)
  ansible.builtin.lineinfile:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    insertafter: "--default-not-ready-toleration-seconds=30"
    line: "    - --default-unreachable-toleration-seconds=30"
    regexp: "--default-unreachable-toleration-seconds="
  when: not configure_kubeadm_already_init.stat.exists

# Les deux lineinfile ci-dessus modifient le manifest statique kube-apiserver :
# la kubelet redemarre alors le pod apiserver, et le port 6443 est brievement
# injoignable (connection refused). Sans cette attente, le `kubectl apply` Calico
# qui suit court-circuite ce redemarrage et echoue. On attend donc que l'API
# server reponde /healthz avant de continuer.
- name: Attendre que l'API server reponde (apres patch du manifest -> redemarrage)
  ansible.builtin.command:
    cmd: kubectl get --raw=/healthz
  register: configure_kubeadm_apiserver_health
  until: configure_kubeadm_apiserver_health.rc == 0 and configure_kubeadm_apiserver_health.stdout == "ok"
  retries: 30
  delay: 5
  changed_when: false

- name: Installer le CNI Calico
  ansible.builtin.command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml
  changed_when: false

- name: Retirer le taint control-plane
  ansible.builtin.command:
    cmd: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  failed_when: false
  changed_when: false

- name: Generer la commande de join
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: configure_kubeadm_join_result
  changed_when: false

- name: Stocker la commande de join
  ansible.builtin.set_fact:
    configure_kubeadm_join_command: "{{ configure_kubeadm_join_result.stdout }}"
