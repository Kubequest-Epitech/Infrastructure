---
- name: Ajouter le repo Helm Kyverno
  ansible.builtin.command:
    cmd: helm repo add kyverno https://kyverno.github.io/kyverno/
  register: kyverno_repo_add
  changed_when: "'has been added' in kyverno_repo_add.stdout"
  failed_when: kyverno_repo_add.rc != 0 and 'already exists' not in kyverno_repo_add.stderr

- name: Mettre a jour les repos Helm
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Creer le namespace {{ kyverno_namespace }}
  ansible.builtin.command:
    cmd: kubectl create namespace {{ kyverno_namespace }}
  register: kyverno_ns_create
  changed_when: "'created' in kyverno_ns_create.stdout"
  failed_when: kyverno_ns_create.rc != 0 and 'already exists' not in kyverno_ns_create.stderr

- name: Copier les values Kyverno sur le control plane
  ansible.builtin.copy:
    src: values.yml
    dest: /tmp/kyverno-values.yml
    mode: "0644"

- name: Deployer Kyverno via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install kyverno kyverno/kyverno
      --namespace {{ kyverno_namespace }}
      --version {{ kyverno_chart_version }}
      --values /tmp/kyverno-values.yml
  register: kyverno_helm_install
  changed_when: "'STATUS: deployed' in kyverno_helm_install.stdout"
  ignore_errors: true

- name: Attendre que le webhook admission controller Kyverno soit pret
  ansible.builtin.command:
    cmd: >
      kubectl wait --for=condition=available
      deployment/kyverno-admission-controller
      -n {{ kyverno_namespace }}
      --timeout=180s
  changed_when: false

- name: Copier les ClusterPolicy sur le control plane
  ansible.builtin.copy:
    src: policies/
    dest: /tmp/kyverno-policies/
    mode: "0644"

- name: Appliquer les ClusterPolicy Kyverno
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/kyverno-policies/
  register: kyverno_policies_apply
  changed_when: "'created' in kyverno_policies_apply.stdout or 'configured' in kyverno_policies_apply.stdout"
