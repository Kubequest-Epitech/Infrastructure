---
- name: Creer le namespace monitoring (idempotent)
  ansible.builtin.command:
    cmd: kubectl create namespace {{ monitoring_namespace }}
  register: ns_monitoring
  changed_when: "'created' in ns_monitoring.stdout"
  failed_when: ns_monitoring.rc != 0 and 'already exists' not in ns_monitoring.stderr

- name: Ajouter le repo Helm prometheus-community
  ansible.builtin.command:
    cmd: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  register: monitoring_repo_add
  changed_when: "'has been added' in monitoring_repo_add.stdout"
  failed_when: monitoring_repo_add.rc != 0 and 'already exists' not in monitoring_repo_add.stderr

- name: Mettre a jour les repos Helm
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

# Mot de passe admin genere dans le cluster : jamais en clair dans git ni dans
# le vault (meme idiome que le secret argocd-redis). Idempotent : on ne regenere
# pas si le secret existe deja.
- name: Verifier si le secret admin Grafana existe
  ansible.builtin.command:
    cmd: kubectl get secret {{ grafana_admin_secret }} -n {{ monitoring_namespace }}
  register: grafana_secret_check
  failed_when: false
  changed_when: false

- name: Creer le secret admin Grafana (mot de passe aleatoire)
  ansible.builtin.shell:
    cmd: >
      kubectl create secret generic {{ grafana_admin_secret }}
      --from-literal=admin-user=admin
      --from-literal=admin-password="$(openssl rand -base64 24)"
      -n {{ monitoring_namespace }}
  when: grafana_secret_check.rc != 0
  changed_when: true

- name: Copier les values kube-prometheus-stack sur le control plane
  ansible.builtin.copy:
    src: values.yml
    dest: /tmp/kube-prometheus-stack-values.yml
    mode: "0644"

- name: Deployer kube-prometheus-stack via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack
      --namespace {{ monitoring_namespace }}
      --version {{ monitoring_chart_version }}
      --values /tmp/kube-prometheus-stack-values.yml
  register: monitoring_helm_install
  changed_when: "'STATUS: deployed' in monitoring_helm_install.stdout"

- name: Attendre que Grafana soit pret
  ansible.builtin.command:
    cmd: >
      kubectl wait --for=condition=available
      deployment/kube-prometheus-stack-grafana
      -n {{ monitoring_namespace }}
      --timeout=300s
  changed_when: false

# Scraping de Traefik : la CRD ServiceMonitor est fournie par kube-prometheus-stack
# (installe juste au-dessus), donc on applique le ServiceMonitor APRES. C'est ce
# qui fait remonter traefik_*_requests_total dans Prometheus -> panneau "requetes
# sur l'ingress" du dashboard. (Pre-requis : metrics Prometheus activees cote role
# traefik.) Tag dediee pour pouvoir le (re)pousser seul.
- name: Copier le ServiceMonitor Traefik sur le control plane
  ansible.builtin.copy:
    src: traefik-servicemonitor.yml
    dest: /tmp/traefik-servicemonitor.yml
    mode: "0644"
  tags: [traefik-metrics]

- name: Appliquer le ServiceMonitor Traefik (scrape /metrics)
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/traefik-servicemonitor.yml
  register: traefik_sm_apply
  changed_when: "'created' in traefik_sm_apply.stdout or 'configured' in traefik_sm_apply.stdout"
  tags: [traefik-metrics]

# Dashboard de demo HPA/autoscaling : provisionne via un ConfigMap labelise
# `grafana_dashboard=1`, auto-importe par le sidecar Grafana (pas besoin de
# redeployer le chart). Tag dediee pour pouvoir le (re)pousser seul.
- name: Copier le manifeste ConfigMap du dashboard HPA demo
  ansible.builtin.template:
    src: grafana-dashboard-hpa.yml.j2
    dest: /tmp/grafana-dashboard-hpa.yml
    mode: "0644"
  tags: [hpa-dashboard]

- name: Appliquer le dashboard HPA demo (auto-importe par le sidecar Grafana)
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/grafana-dashboard-hpa.yml
  register: hpa_dashboard_apply
  changed_when: "'created' in hpa_dashboard_apply.stdout or 'configured' in hpa_dashboard_apply.stdout"
  tags: [hpa-dashboard]

- name: Afficher les informations monitoring
  ansible.builtin.include_tasks: info.yml
