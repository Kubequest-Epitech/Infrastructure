---
- name: Render Kubernetes Secrets manifest from vault on the control plane
  ansible.builtin.template:
    src: secrets.yml.j2
    dest: /tmp/kubequest-secrets.yml
    mode: "0600"
  no_log: true

- name: Apply Kubernetes Secrets
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/kubequest-secrets.yml
  register: secrets_apply
  changed_when: "'created' in secrets_apply.stdout or 'configured' in secrets_apply.stdout"
  no_log: true

- name: Remove rendered Secrets manifest from disk
  ansible.builtin.file:
    path: /tmp/kubequest-secrets.yml
    state: absent
