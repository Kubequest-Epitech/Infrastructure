---
- name: Load app secrets from the vault
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/secrets/app-secrets.yml"
  # no_log: true   # a reactiver une fois le debug termine

- name: Render Kubernetes Secrets manifest from vault on the control plane
  ansible.builtin.template:
    src: secrets.yml.j2
    dest: /tmp/kubequest-secrets.yml
    mode: "0600"
  #no_log: true

- name: Apply Kubernetes Secrets
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/kubequest-secrets.yml
  register: secrets_apply
  changed_when: "'created' in secrets_apply.stdout or 'configured' in secrets_apply.stdout"
  #no_log: true

- name: Attacher les imagePullSecrets au ServiceAccount default (ns application)
  ansible.builtin.command:
    cmd: >
      kubectl -n {{ application_namespace }} patch serviceaccount default --type merge
      -p '{"imagePullSecrets":[{"name":"kubequest-dockerhub-backend"},{"name":"kubequest-dockerhub-frontend"}]}'
  register: sa_patch
  changed_when: true
  retries: 5
  delay: 3
  until: sa_patch.rc == 0

- name: Remove rendered Secrets manifest from disk
  ansible.builtin.file:
    path: /tmp/kubequest-secrets.yml
    state: absent
