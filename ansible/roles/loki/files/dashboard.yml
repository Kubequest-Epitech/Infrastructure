apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  loki-dashboard.json: |-
    {
      "title": "Kubernetes Logs",
      "uid": "kubernetes-logs-loki",
      "description": "Logs des pods Kubernetes via Loki + Promtail",
      "tags": ["loki", "logs", "kubernetes"],
      "editable": false,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 38,
      "version": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Datasource",
            "query": "loki",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "refresh": 1
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "query": "label_values(namespace)",
            "current": { "text": "application", "value": "application" },
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "pod",
            "type": "query",
            "label": "Pod",
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "query": "label_values({namespace=~\"$namespace\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "Logs",
          "gridPos": { "h": 24, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "prettifyLogMessage": false
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${datasource}" },
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "queryType": "range"
            }
          ]
        }
      ]
    }
