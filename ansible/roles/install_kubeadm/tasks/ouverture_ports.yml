---
- name: Ouvrir les ports master - API server (6443)
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "6443"
    jump: ACCEPT
  when: inventory_hostname in groups['kube1']

- name: Ouvrir les ports master - etcd (2379-2380)
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "2379:2380"
    jump: ACCEPT
  when: inventory_hostname in groups['kube1']

- name: Ouvrir les ports master - kube-scheduler (10251)
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "10251"
    jump: ACCEPT
  when: inventory_hostname in groups['kube1']

- name: Ouvrir les ports master - kube-controller-manager (10252)
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "10252"
    jump: ACCEPT
  when: inventory_hostname in groups['kube1']

- name: Ouvrir le port Kubelet API (10250) sur tous les noeuds
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "10250"
    jump: ACCEPT

- name: Ouvrir les ports NodePort (30000-32767) sur les workers
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "30000:32767"
    jump: ACCEPT
  when: inventory_hostname not in groups['kube1']
