---
- name: Ajouter le repo Kubernetes
  become: true
  yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/rpm/"
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/rpm/repodata/repomd.xml.key"
    enabled: true

- name: Installer kubeadm, kubelet et kubectl
  become: true
  yum:
    name:
      - "kubeadm-{{ kube_version }}.*"
      - "kubelet-{{ kube_version }}.*"
      - "kubectl-{{ kube_version }}.*"
    state: present
    disable_excludes: kubernetes

- name: Activer et demarrer kubelet
  become: true
  systemd:
    name: kubelet
    enabled: true
    state: started
