name: Ansible Lint

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint Ansible Playbooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible Lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run Ansible Lint
        run: |
          # -c : la config vit dans ansible/.ansible-lint (skip_list, exclude_paths).
          # Sans ce flag, ansible-lint lance depuis la racine du repo ne la trouve
          # pas (decouverte basee sur le cwd) et la config n'est jamais appliquee.
          ansible-lint -c ansible/.ansible-lint ./ansible